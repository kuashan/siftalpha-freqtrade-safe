name: Safe Adapter Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON
        run: python -m json.tool user_data/config.json >/dev/null
      - name: Run safety gate
        run: python -m unittest discover -s tests -q
